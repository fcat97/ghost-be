name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run server tests
        run: ./kotlin test -m server

      - name: Build ghost-be release binary
        run: ./kotlin build -m server -v release

      - name: Stage release binary
        run: cp build/tasks/_server_linkLinuxX64Release/server.kexe ghost-be-linux-x64

      - name: Build client release AAR
        run: ./kotlin build -m client -v release

      - name: Stage client AAR
        run: cp build/tasks/_client_aarAndroidRelease/client-jvm.aar "ghost-be-client-${GITHUB_REF_NAME}.aar"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ghost-be-linux-x64
            ghost-be-client-*.aar
